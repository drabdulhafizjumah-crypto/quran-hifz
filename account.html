</head><body><style>
/* ===== الألوان: غيّر القيم هنا فقط بعد اعتماد الاسم =====

   --p اللون الرئيسي · --p2 الثانوي · --acc لون التنبيه والميكروفون

:root{

  color-scheme:light}

  --p:light-dark(#0b6b50,#3fb08c);--p2:light-dark(#c9a55a,#c9a55a);--acc:light-dark(#c2362b,#ff7a6b);

<script>
/* الربط بالخادم (Supabase): الدخول، ونسخ التقدّم إلى الحساب ومزامنته بين الأجهزة، ونموذج الأفكار.
   مشترك بين الصفحات الثلاث. إن كان الإعداد فارغاً يعمل الموقع كله على الجهاز كما كان.
   المفتاح هنا هو المفتاح العام (anon/publishable) وحده، والحماية في قواعد RLS على الخادم. */
window.QA_CLOUD=(()=>{
const CFG={url:'https://igvjhyskbejhqpdcawic.supabase.co',key:'sb_publishable_scmaRFsCydWPc8Ysp3Zhiw_lL5hBBz9'};
const on=!!(CFG.url&&!CFG.url.startsWith('/*')&&CFG.key&&!CFG.key.startsWith('/*'));
const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const J=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v??d}catch(e){return d}};
const CACHE='qa-cache',SYNCED='qa-synced';
const progKey=pid=>'hifz-proto-v1'+(pid?':'+pid:'');
/* هل على هذا الجهاز جلسة دخول؟ (دون تحميل المكتبة) */
function hasSession(){if(!on)return false;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k))return true}}catch(e){}return false}
let _c=null;
function client(){
  if(!on)return Promise.reject(new Error('off'));
  return _c||(_c=new Promise((res,rej)=>{
    const go=()=>res(window.supabase.createClient(CFG.url,CFG.key,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}}));
    if(window.supabase&&window.supabase.createClient)return go();
    const s=document.createElement('script');s.src=LIB;s.onload=go;s.onerror=()=>{_c=null;rej(new Error('تعذّر الاتصال بالخادم. تحقّق من الإنترنت ثم أعد المحاولة.'))};document.head.append(s)}));
}

/* ===== دمج تقدّمين: لا يضيع حفظ من أي جهاز ===== */
function canon(o){if(Array.isArray(o))return'['+o.map(canon).join(',')+']';if(o&&typeof o=='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o)}
function better(a,b){if(!a)return b;if(!b)return a;
  if(!!a.mem!=!!b.mem)return a.mem?a:b;if((a.due||0)!=(b.due||0))return(a.due||0)>(b.due||0)?a:b;
  if((a.b||0)!=(b.b||0))return(a.b||0)>(b.b||0)?a:b;return(a.err||0)<=(b.err||0)?a:b}
function merge(L,R){L=L||{};R=R||{};const M=Object.assign({},R,L);
  const ay={},A=L.ay||{},B=R.ay||{};for(const k of new Set([...Object.keys(A),...Object.keys(B)]))ay[k]=better(A[k],B[k]);M.ay=ay;
  const q={},qa=L.quiz||{},qb=R.quiz||{};for(const k of new Set([...Object.keys(qa),...Object.keys(qb)]))q[k]=Math.max(+qa[k]||0,+qb[k]||0);if(L.quiz||R.quiz)M.quiz=q;
  if(L.badges||R.badges)M.badges=Object.assign({},R.badges||{},L.badges||{});
  if('pts'in L||'pts'in R)M.pts=Math.max(+L.pts||0,+R.pts||0);
  if('last'in L||'last'in R){const ll=+L.last||0,rl=+R.last||0;if(rl>ll){M.last=rl;M.streak=R.streak||0}else if(rl==ll)M.streak=Math.max(+L.streak||0,+R.streak||0)}
  if('doneDay'in L||'doneDay'in R){const ld=+L.doneDay||0,rd=+R.doneDay||0;if(rd>ld){M.doneDay=rd;M.doneCount=R.doneCount||0}else if(rd==ld)M.doneCount=Math.max(+L.doneCount||0,+R.doneCount||0)}
  for(const k of Object.keys(M))if(M[k]===undefined)delete M[k];
  return M}

/* ===== بيانات الحساب المحفوظة مؤقتاً على الجهاز (لتعمل الصفحات فوراً) ===== */
async function refresh(){
  const sb=await client();const {data:{session}}=await sb.auth.getSession();
  if(!session){ls.del(CACHE);return null}
  const uid=session.user.id;
  const [p,k,l]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).maybeSingle(),sb.from('children').select('*').order('created_at'),sb.rpc('my_links')]);
  if(p.error)throw p.error;
  const user=p.data?{...p.data,id:uid}:{id:uid,email:session.user.email,name:(session.user.user_metadata?.name)||session.user.email.split('@')[0],role:session.user.user_metadata?.role||'learner',country:'',age:null,pendingProfile:true};
  const kids=(k.data||[]).map(x=>({id:x.id,name:x.name,age:x.age,kind:'local'}));
  const links=(l.data||[]);
  const c={user,kids,links,at:Date.now()};ls.set(CACHE,JSON.stringify(c));return c}
function cache(){return hasSession()?J(CACHE,null):null}

/* ===== المزامنة ===== */
const pushT={};
async function pushNow(pid){
  const c=cache();if(!c)return;const sb=await client();
  const st=J(progKey(pid),null);if(!st)return;
  const {error}=await sb.from('progress').upsert({owner_id:c.user.id,profile:pid||'',state:st,updated_at:new Date().toISOString()});
  if(!error)ls.set(SYNCED,String(Date.now()))}
/* يُستدعى بعد كل حفظ في المصحف: يرفع بعد ثوانٍ قليلة من آخر تغيير */
function push(pid){if(!hasSession())return;pid=pid||'';
  const c=J(CACHE,null);if(pid&&!(c&&c.kids.some(k=>k.id==pid)))return; // ملف حساب مربوط: للقراءة فقط
  clearTimeout(pushT[pid]);pushT[pid]=setTimeout(()=>pushNow(pid).catch(()=>{}),4000)}
function flush(){for(const pid in pushT){clearTimeout(pushT[pid]);delete pushT[pid];pushNow(pid).catch(()=>{})}}
/* يجلب تقدّم الحساب ويدمجه مع الجهاز ويرفع الناتج. يُرجع true إن تغيّر شيء على هذا الجهاز. */
async function sync(){
  if(!hasSession())return false;const sb=await client();const c=await refresh();if(!c)return false;
  const mine=['',...c.kids.map(k=>k.id)];let changed=false;
  const {data,error}=await sb.from('progress').select('owner_id,profile,state,updated_at');if(error)throw error;
  const rows=data||[];
  for(const pid of mine){
    const row=rows.find(r=>r.owner_id==c.user.id&&r.profile==pid),loc=J(progKey(pid),null);
    if(!row&&!loc)continue;
    const m=merge(loc||{},row?row.state:{});
    if(canon(m)!=canon(loc||{})){ls.set(progKey(pid),JSON.stringify(m));changed=true}
    if(!row||canon(m)!=canon(row.state))await sb.from('progress').upsert({owner_id:c.user.id,profile:pid,state:m,updated_at:new Date().toISOString()});
  }
  /* تقدّم الأبناء المربوطين بموافقتهم: نسخة للعرض فقط */
  for(const l of c.links)if(l.side=='parent'&&l.status=='approved'){
    const row=rows.find(r=>r.owner_id==l.other_id&&r.profile=='');const key=progKey(l.other_id);
    if(row&&canon(row.state)!=canon(J(key,{}))){ls.set(key,JSON.stringify(row.state));changed=true}}
  ls.set(SYNCED,String(Date.now()));return changed}

  return r.ok}

const DB_KEY="qa-demo-db",SES_KEY="qa-session";

function mail(db,to,subject,body,href,label){db.outbox.unshift({id:rid("m"),to,subject,body,href,label,at:Date.now(),read:false})}
const MIN=60e3,DAY=864e5;
const API={
  /* Supabase: auth.signInWithOtp({email, options:{data:{name,country,role,age}, emailRedirectTo}})
     الحساب لا يُنشأ إلا بعد أن يضغط صاحبه الرابط في بريده. */
  async signUp(d){const db=load(),email=normEmail(d.email);
    if(Object.values(db.users).some(u=>u.email==email)){return this.requestLogin(email)}
    const tok=rid("t");db.tokens[tok]={kind:"signup",email,data:{name:d.name.trim(),country:d.country,role:d.role,age:d.role=="learner"?+d.age:null},exp:Date.now()+15*MIN};

  async requestLink(childEmail){const db=load(),me=this.me(),email=normEmail(childEmail);

    const l={id:rid("l"),parent:me.id,child:c.id,status:"pending",token:rid("a"),exp:Date.now()+7*DAY,created:Date.now()};db.links[l.id]=l;

/* ===================================================================
   الخادم الحقيقي (Supabase): يحلّ محلّ الدوال أعلاه حين يُضبط في qa_cloud.js.
   الدخول برابط إلى البريد، والربط بموافقة الابن من داخل حسابه.
   =================================================================== */
const CLOUD=QA_CLOUD.on;
const ERR={not_parent:"طلب الربط متاح لحساب وليّ الأمر فقط.",self:"هذا بريدك أنت. اكتب بريد ابنك أو ابنتك.",is_parent:"هذا البريد مسجّل لوليّ أمر، لا لمتعلّم.",already_linked:"هذا الحساب مربوط بك من قبل.",already_pending:"أرسلت طلباً إلى هذا البريد، وهو ينتظر موافقته.",too_many:"أرسلت طلبات كثيرة اليوم. حاول غداً.",not_found:"لم نجد هذا الطلب. ربما أُلغي.",answered:"أُجيب عن هذا الطلب من قبل.",expired:"انتهت صلاحية الطلب. اطلب من وليّ أمرك إرساله من جديد."};
const cerr=e=>{const m=String(e&&e.message||e||"");if(/[\u0600-\u06FF]/.test(m))return new Error(m);for(const k in ERR)if(m.includes(k))return new Error(ERR[k]);
  if(/rate|security purposes|too many/i.test(m))return new Error("طلبت روابط كثيرة في وقت قصير. انتظر دقيقة ثم حاول.");
  if(/fetch|network|Failed/i.test(m))return new Error("تعذّر الاتصال بالخادم. تحقّق من الإنترنت ثم أعد المحاولة.");return new Error("حدث خطأ، أعد المحاولة. ("+m.slice(0,80)+")")};
const back=()=>QA.CFG.siteUrl+"account.html";
if(CLOUD)Object.assign(API,{
  async signUp(d){const sb=await QA_CLOUD.client(),email=normEmail(d.email);
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:back(),shouldCreateUser:true,data:{name:d.name.trim(),country:d.country,role:d.role,age:d.role=="learner"?+d.age:null}}});
    if(error)throw cerr(error);return{sent:email}},
  async requestLogin(e){const sb=await QA_CLOUD.client(),email=normEmail(e);
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:back(),shouldCreateUser:false}});
    // لا نكشف إن كان البريد مسجّلاً: الشاشة واحدة في الحالتين
    if(error&&/rate|security purposes|too many|fetch|network/i.test(error.message))throw cerr(error);return{sent:email}},
  me(){const c=QA_CLOUD.cache();return c&&c.user},
  async logout(){try{const sb=await QA_CLOUD.client();QA_CLOUD.flush();await sb.auth.signOut()}catch(e){}ls.del("qa-cache");ls.del("qa-profile")},
  async updateMe(d){const sb=await QA_CLOUD.client(),me=this.me(),x={name:d.name.trim(),country:d.country};if("age"in d)x.age=d.age;
    const {error}=await sb.from("profiles").update(x).eq("id",me.id);if(error)throw cerr(error);await QA_CLOUD.refresh();return this.me()},
  async addKid(name,age){const sb=await QA_CLOUD.client();const {data,error}=await sb.from("children").insert({name:name.trim(),age:+age||null}).select().single();
    if(error)throw cerr(error);await QA_CLOUD.refresh();return data},
  async removeKid(id){const sb=await QA_CLOUD.client();const {error}=await sb.from("children").delete().eq("id",id);if(error)throw cerr(error);ls.del(QA.progKey(id));await QA_CLOUD.refresh()},
  async requestLink(childEmail){const sb=await QA_CLOUD.client(),email=normEmail(childEmail);
    if(email==this.me().email)throw new Error(ERR.self);
    const {data,error}=await sb.rpc("request_link",{child_email:email});if(error)throw cerr(error);await QA_CLOUD.refresh();
    return data=="pending"?{msg:`أرسلنا الطلب. يراه صاحب البريد ${esc(email)} في صفحة حسابه حين يدخل، ولا يتم الربط إلا بموافقته، ثم يظهر هنا.`}
      :{msg:`لا يوجد حساب بالبريد ${esc(email)}. ادعُه إلى إنشاء حساب من «${N[0]}»، ثم أرسل طلب الربط مرة أخرى.`}},
  async answerById(id,yes){const sb=await QA_CLOUD.client();const {data,error}=await sb.rpc("answer_link",{link_id:id,approve:yes});if(error)throw cerr(error);await QA_CLOUD.refresh();return data},
  async unlink(id){const sb=await QA_CLOUD.client();const {error}=await sb.rpc("unlink",{link_id:id});if(error)throw cerr(error);await QA_CLOUD.refresh()},
  links(){const c=QA_CLOUD.cache();if(!c)return[];const me=c.user;
    return c.links.map(l=>l.side=="parent"?{id:l.id,parent:me.id,child:l.other_id,status:l.status,p:me,c:{name:l.other_name||"حساب متعلّم",email:l.other_email}}
      :{id:l.id,parent:l.other_id,child:me.id,status:l.status,p:{name:l.other_name,email:l.other_email},c:me})},
  outbox(){return[]},markRead(){},reset(){}
});

/* ===== البيانات المساعدة ===== */
const COUNTRIES=["الإمارات","السعودية","الكويت","قطر","البحرين","عُمان","اليمن","العراق","سوريا","الأردن","فلسطين","لبنان","مصر","السودان","ليبيا","تونس","الجزائر","المغرب","موريتانيا","الصومال","جيبوتي","جزر القمر","تركيا","ماليزيا","إندونيسيا","باكستان","المملكة المتحدة","ألمانيا","فرنسا","الولايات المتحدة","كندا","أستراليا","بلد آخر"];
const ROLE={learner:"متعلّم",parent:"وليّ أمر"};
const ICON_MAIL=`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--tint)"/><rect x="16" y="22" width="40" height="28" rx="5" fill="var(--p)"/><path d="M19 26l17 13 17-13" stroke="var(--onp)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_OK=`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--tint)"/><path d="M22 37l9 9 19-20" stroke="var(--p)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const activeProfile=()=>J("qa-profile",null);
function setProfile(p){if(p&&p.id)ls.set("qa-profile",JSON.stringify(p));else ls.del("qa-profile")}
function progLine(P){return P.any?`${count(P.mem,["آية واحدة محفوظة","آيتان محفوظتان","آيات محفوظة","آية محفوظة"])}، و${count(P.full.length,["سورة واحدة متقنة","سورتان متقنتان","سور متقنة","سورة متقنة"])}`+(P.due?`، و${num(P.due)} للمراجعة`:""):"لم يبدأ الحفظ بعد"}
function statsBox(P){return `<div class="stats"><div><b>${num(P.mem)}</b><span>آية محفوظة</span></div><div><b>${num(P.full.length)}</b><span>سورة متقنة</span></div><div><b>${num(P.due)}</b><span>للمراجعة اليوم</span></div><div><b>${num(P.streak)}</b><span>أيام متتالية</span></div></div>`}
let flash="";
function go(h){if(location.hash.slice(1)==h)render();else location.hash=h}

    <div class="err" id="err4" role="alert"></div><button class="btn" type="submit">أرسل طلب الربط</button>
  </form>
  ${mineL.length?`<h3 style="margin-top:18px">طلبات الربط</h3><ul class="list">${mineL.map(l=>`<li><b>${esc(l.c.name)}</b><span class="muted" dir="ltr">${esc(l.c.email)}</span><span class="sp">${l.status=="pending"?'<span class="pill wait">ينتظر موافقته</span>':'<span class="pill no">لم يوافق</span>'}</span></li>`).join("")}</ul>`:""}
</div>`}
};

/* ===== التوجيه ===== */
function render(){
  const h=decodeURIComponent(location.hash.slice(1)),[k,v]=h.split("="),u=API.me(),el=$("#view");
  if(k=="verify"){API.verify(v).then(u=>{flash=`دخلت بنجاح. أهلاً بك يا ${esc(u.name.split(" ")[0])}.`;history.replaceState(null,"","#");render();mailUI()}).catch(e=>{el.innerHTML=V.error(e.message);mailUI()});return}
  if(k=="approve"&&CLOUD){go("");return}
  if(k=="approve"){el.innerHTML=V.approve(v);const ans=yes=>API.answerLink(v,yes).then(s=>{el.innerHTML=`<div class="card big">${ICON_OK}<h2>${s=="approved"?"تمّ الربط":"لم يُربط شيء"}</h2><p class="muted">${s=="approved"?"أرسلنا تأكيداً إلى وليّ أمرك، وصار يرى تقدّمك.":"أبلغنا صاحب الطلب أنك لم توافق."}</p><a class="btn o" href="#">حسابي</a></div>`;mailUI()}).catch(e=>$("#err").textContent=e.message);
    $("#yes")&&($("#yes").onclick=()=>ans(true));$("#no")&&($("#no").onclick=()=>ans(false));return}
  if(k=="sent"){el.innerHTML=V.sent(v||"");return}
  if(u&&(!k||k=="parent"||k=="profiles"||k=="login"||k=="signup")){el.innerHTML=V.dash();flash="";wireDash();if(k=="parent"||k=="profiles")$("#"+k)?.scrollIntoView({block:"start"});return}
  if(k=="signup"){el.innerHTML=V.signup(v);wireSign();return}
  if(k=="login"){el.innerHTML=V.login();wireLogin();return}
  if(k=="parent"){el.innerHTML=V.signup("parent");wireSign();return}
  el.innerHTML=V.home();
}
function wireSign(){const f=$("#fSign"),age=()=>{const r=f.role.value;$("#ageWrap").hidden=r!="learner";const a=+f.age.value;$("#kidNote").hidden=!(r=="learner"&&a&&a<16)};
  f.onchange=f.oninput=age;age();
  f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));let m="";
    if(!d.name.trim())m="اكتب الاسم.";else if(!okEmail(normEmail(d.email)))m="اكتب بريداً صحيحاً، مثل name@example.com";else if(!d.country)m="اختر البلد.";else if(d.role=="learner"&&!(+d.age>=4&&+d.age<=120))m="اكتب العمر بالأرقام.";
    $("#err").textContent=m;if(m)return;const bt=f.querySelector("[type=submit]");bt.disabled=true;try{const r=await API.signUp(d);mailUI(true);go("sent="+r.sent)}catch(x){$("#err").textContent=x.message;bt.disabled=false}}}
function wireLogin(){const f=$("#fLogin");f.onsubmit=async e=>{e.preventDefault();const em=normEmail(f.email.value);if(!okEmail(em)){$("#err").textContent="اكتب بريداً صحيحاً.";return}const bt=f.querySelector("[type=submit]");bt.disabled=true;try{const r=await API.requestLogin(em);mailUI(true);go("sent="+r.sent)}catch(x){$("#err").textContent=x.message;bt.disabled=false}}}
function wireDash(){
  $("#out").onclick=async()=>{await API.logout();flash="";go("")};
  $("#edit").onclick=()=>{$("#fEdit").hidden=false;$("#edit").hidden=true};
  $("#cancelEdit").onclick=()=>{$("#fEdit").hidden=true;$("#edit").hidden=false};
  $("#fEdit").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()){$("#err2").textContent="اكتب الاسم.";return}if("age"in d)d.age=+d.age||null;try{await API.updateMe(d);flash="حُفظت بياناتك.";render()}catch(x){$("#err2").textContent=x.message}};
  $$("[data-unlink]").forEach(b=>b.onclick=async()=>{if(b.dataset.c){try{await API.unlink(b.dataset.unlink)}catch(x){flash=esc(x.message);render();return}const ap=activeProfile();if(ap&&!QA.kids().some(k=>k.id==ap.id))setProfile(null);flash="أُلغي الربط.";render()}else{b.dataset.c=1;b.textContent="اضغط مرة أخرى للتأكيد"}});
  $$("[data-ans]").forEach(b=>b.onclick=async()=>{try{const s=await API.answerById(b.dataset.ans,!!b.dataset.yes);flash=s=="approved"?"تمّ الربط. صار وليّ أمرك يرى تقدّمك، ويمكنك إلغاء الربط في أي وقت.":"لم يُربط شيء.";render()}catch(x){flash=esc(x.message);render()}});
  $$("[data-use]").forEach(b=>b.onclick=()=>{const id=b.dataset.use,k=QA.kids().find(k=>k.id==id);setProfile(k?{id:k.id,name:k.name,age:k.age}:null);location.href="hifz.html#learn"});
  $$("[data-del]").forEach(b=>b.onclick=async()=>{if(b.dataset.c){try{await API.removeKid(b.dataset.del)}catch(x){flash=esc(x.message);render();return}if(activeProfile()?.id==b.dataset.del)setProfile(null);flash=CLOUD?"حُذف الملف وتقدّمه.":"حُذف الملف وتقدّمه من هذا الجهاز.";render()}else{b.dataset.c=1;b.textContent="سيُحذف تقدّمه أيضاً. اضغط للتأكيد"}});
  const tb=$(".tabs2");if(!tb)return;
  tb.onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;$$(".tabs2 button").forEach(x=>x.setAttribute("aria-selected",x==b));$("#fKid").hidden=b.dataset.t!="new";$("#fLink").hidden=b.dataset.t!="link"};
  $("#fKid").onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.name.value.trim()){$("#err3").textContent="اكتب اسم الطفل.";return}if(!(+f.age.value>=3)){$("#err3").textContent="اكتب العمر بالأرقام.";return}let k;try{k=await API.addKid(f.name.value,f.age.value)}catch(x){$("#err3").textContent=x.message;return}flash=`أُضيف ملف ${esc(k.name)}. اضغط «ابدأ الحفظ باسمه» قبل أن يحفظ.`;render()};
  $("#fLink").onsubmit=async e=>{e.preventDefault();const em=normEmail(e.target.email.value);if(!okEmail(em)){$("#err4").textContent="اكتب بريداً صحيحاً.";return}
    try{const r=await API.requestLink(em);flash=r.msg?r.msg:r.pending?`أرسلنا طلب الموافقة إلى بريد ${esc(r.pending)}، وسيصلك تأكيد حين يوافق.`:`لا يوجد حساب بهذا البريد، فأرسلنا إليه دعوة للتسجيل. بعد تسجيله أرسل طلب الربط مرة أخرى.`;mailUI(true);render()}catch(x){$("#err4").textContent=x.message}};
}
/* ===== البريد التجريبي ===== */
function mailUI(open){const ms=API.outbox(),unread=ms.filter(m=>!m.read).length;$("#mcount").textContent=num(unread);$("#mcount").hidden=!unread;
  const box=$("#mbox");
  box.innerHTML=`<h3>البريد التجريبي<button id="mclose" aria-label="إغلاق">×</button></h3><p class="muted" style="font-size:.88rem;margin:0">الرسائل التي كان الموقع سيرسلها. يظهر هنا بريد كل الحسابات التجريبية على هذا المتصفح.</p>`+
    (ms.length?ms.map(m=>`<div class="mail"><div class="to">${esc(m.to)}</div><b>${esc(m.subject)}</b><p>${esc(m.body)}</p>${m.href?`<a class="btn s" href="${esc(m.href.replace(QA.CFG.siteUrl,""))}">${esc(m.label)}</a>`:""}</div>`).join(""):`<p class="muted">لا رسائل بعد.</p>`)+
    `<div class="acts"><button class="btn o s d" id="mreset">مسح كل بيانات التجربة</button></div>`;
  $("#mclose").onclick=()=>toggle(false);
  $("#mreset").onclick=e=>{if(e.target.dataset.c){API.reset();toggle(false);mailUI();go("")}else{e.target.dataset.c=1;e.target.textContent="تُحذف الحسابات التجريبية والرسائل. اضغط للتأكيد"}};
  box.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>toggle(false)));
  if(open)toggle(true)}
function toggle(o){$("#mbox").hidden=!o;$("#mbtn").setAttribute("aria-expanded",o);if(o){API.markRead();$("#mcount").hidden=true}}
$("#mbtn").onclick=()=>{const o=$("#mbox").hidden;mailUI();toggle(o)};
addEventListener("hashchange",render);
if(!CLOUD){render();mailUI()}
else{
  $("#mbtn").hidden=true;$(".demo-note").hidden=true;
  const h=location.hash,fromLink=/access_token=/.test(h),bad=/error_description=/.test(h);
  let badMsg="";if(bad){const q=new URLSearchParams(h.slice(1));badMsg=/expired|invalid/i.test(q.get("error_code")+q.get("error_description"))?"انتهت صلاحية الرابط أو استُعمل من قبل. اطلب رابطاً جديداً.":q.get("error_description")||"تعذّر الدخول."}
  $("#view").innerHTML=`<div class="card"><p class="muted" style="margin:0">لحظة…</p></div>`;
  QA_CLOUD.client().then(sb=>sb.auth.getSession()).then(async()=>{
    if(fromLink||bad)history.replaceState(null,"",location.pathname+location.search);
    await QA_CLOUD.refresh();const u=API.me();
    if(u&&fromLink)flash=`دخلت بنجاح. أهلاً بك يا ${esc(u.name.split(" ")[0])}.`;
    if(bad){$("#view").innerHTML=V.error(badMsg);return}
    render();
    if(u)QA_CLOUD.sync().then(ch=>{if(ch||fromLink)render()}).catch(()=>{});
  }).catch(e=>{if(bad||fromLink)$("#view").innerHTML=V.error(cerr(e).message);else render()});
  QA_CLOUD.client().then(sb=>sb.auth.onAuthStateChange(ev=>{if(ev=="SIGNED_OUT"){ls.del("qa-cache")}})).catch(()=>{});
}
}
</script>
</body></html>
